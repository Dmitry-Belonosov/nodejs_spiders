<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAPD & SEBUDA Bump</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="container">
		<div id="top">
			<div class="menu menu-active">SEBUDA</div>
			<div class="menu">SWAPD</div>
		</div>
		<div id="status">
			<div id="sebuda">
				<div id="task">task: sebuda.com</div>
				<div id="task_status"></div>
				<div id="last_check"></div>
				<div id="all_data"></div>
			</div>
			<div id="swapd">
				<div id="stask">task: swapd.com</div>
				<div id="stask_status"></div>
				<div id="slast_check"></div>
				<div id="sall_data"></div>				
			</div>
		</div>
		<div id="bottom">
			<button class="action start">START</button>
			<button id="force_check" style="display:none;" class="force">Force Check</button>
		</div>
	</div>
    <script src="script.js"></script>
</body>
</html>
